<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redis-term</title>
<style>
  * { box-sizing: border-box; }
  html, body { overscroll-behavior: none; }
  body { margin: 0; font-family: -apple-system, Menlo, monospace; font-size: 13px; color: #ddd; background: #1e1e1e; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #252526; border-bottom: 1px solid #333; }
  header select, header input { background: #1e1e1e; color: #ddd; border: 1px solid #444; padding: 4px 6px; border-radius: 3px; font: inherit; }
  /* custom connection dropdown: a native <select> can't align the [KIND] tags
     (its popup ignores font-family), so we render our own with a monospace list. */
  #conn { position: relative; width: 280px; font-family: Menlo, monospace; user-select: none; }
  #conn .cur { background: #1e1e1e; border: 1px solid #444; border-radius: 3px; padding: 4px 22px 4px 8px; cursor: pointer; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #conn .cur::after { content: '▾'; position: absolute; right: 8px; color: #888; }
  #conn .menu { position: absolute; top: 100%; left: 0; right: 0; margin-top: 2px; background: #252526; border: 1px solid #444; border-radius: 3px; z-index: 20; max-height: 320px; overflow: auto; display: none; }
  #conn.open .menu { display: block; }
  #conn .opt { padding: 4px 8px; cursor: pointer; white-space: pre; }
  #conn .opt:hover { background: #2a2d2e; }
  #conn .opt.sel { background: #094771; }
  header .title { font-weight: bold; color: rgb(163, 72, 72); margin-right: 2px; }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 300px; flex: 0 0 auto; border-right: 1px solid #333; display: flex; flex-direction: column; min-height: 0; }
  #splitter { flex: 0 0 5px; cursor: col-resize; background: transparent; margin-left: -3px; z-index: 5; }
  #splitter:hover, #splitter.dragging { background: #094771; }
  body.col-resizing { cursor: col-resize; user-select: none; }
  #search { padding: 6px; border-bottom: 1px solid #333; display: flex; gap: 6px; align-items: stretch; }
  #search input { flex: 1; min-width: 0; background: #1e1e1e; color: #ddd; border: 1px solid #444; padding: 5px; border-radius: 3px; font: inherit; }
  #treeReload { background: #333; color: #ddd; border: 1px solid #444; border-radius: 3px; padding: 0 9px; cursor: pointer; font: inherit; flex: 0 0 auto; }
  #treeReload:hover { background: #0e639c; border-color: #0e639c; color: #fff; }
  #keys { flex: 1; overflow: auto; padding: 2px 0; }
  .node { white-space: nowrap; cursor: pointer; user-select: none; line-height: 20px; }
  .node:hover { background: #2a2d2e; }
  .node.active { background: #094771; }
  .node .label { display: inline-block; vertical-align: top; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 20px); }
  .node .tw { display: inline-block; width: 14px; text-align: center; color: #888; }
  .node.leaf .tw { color: transparent; }
  .node .count { color: #888; font-size: 11px; margin-left: 4px; }
  .children.collapsed { display: none; }
  #content { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #value { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 0 12px 12px; }
  .meta { padding: 8px 12px; background: #252526; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; }
  .badge { background: #d33; color: #fff; padding: 1px 7px; border-radius: 3px; font-size: 11px; text-transform: uppercase; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
  table { border-collapse: separate; border-spacing: 0; width: auto; max-width: 100%; }
  td, th { border: 1px solid #333; border-left: none; padding: 4px 8px; text-align: left; vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 600px; }
  td:first-child, th:first-child { border-left: 1px solid #333; }
  /* sticky header: pinned below the query bar (--qh) and the edit/delete toolbar
     (--eh) so it stays visible while scrolling. With border-collapse separate,
     sticky cells keep their borders while scrolling. */
  th { background: #252526; position: sticky; top: calc(var(--qh, 0px) + var(--eh, 0px)); z-index: 3; }
  tr:not(:first-child) td { border-top: none; }
  /* the sticky query bar pinned to the top of the scroll area. left:-12px (with
     the matching -12px margins) bleeds it over #value's horizontal padding so no
     row peeks through the side gutters during horizontal scroll. left:0 would let
     sticky clamp the border box to 0 and re-expose the gutter. */
  .qbar { position: sticky; top: 0; left: -12px; z-index: 4; background: #1e1e1e; margin: 0 -12px; padding: 12px 12px 2px; }
  /* the edit/delete toolbar pinned right below the query bar so it never scrolls
     out of view while there are staged edits or selected rows */
  #editbar { position: sticky; top: var(--qh, 0px); left: -12px; z-index: 4; background: #1e1e1e; margin: 0 -12px; }
  th .rs { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; }
  th .rs:hover { background: #0e639c; }
  #cmdbar { border-top: 1px solid #333; background: #252526; }
  #cmdout { max-height: 160px; overflow: auto; padding: 8px 12px; color: #9cdcfe; white-space: pre-wrap; word-break: break-all; }
  #cmdin { display: flex; padding: 6px; gap: 6px; }
  #cmdin span { color: #d33; align-self: center; }
  #cmdin input { flex: 1; background: #1e1e1e; color: #ddd; border: 1px solid #444; padding: 6px; border-radius: 3px; font: inherit; }
  .empty { color: #888; padding: 20px; }
  /* header connection action buttons */
  .hbtn { background: #333; color: #ddd; border: 1px solid #444; border-radius: 3px; padding: 3px 8px; cursor: pointer; font: inherit; line-height: 1.4; }
  .hbtn:hover { background: #0e639c; border-color: #0e639c; color: #fff; }
  /* connection settings modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: #252526; border: 1px solid #444; border-radius: 5px; padding: 16px 18px; width: 420px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .modal-title { font-weight: bold; margin-bottom: 12px; color: #ddd; }
  .frow { display: flex; align-items: center; margin-bottom: 8px; }
  .frow label { width: 64px; color: #9ca3af; flex: 0 0 auto; }
  .frow input, .frow select { flex: 1; background: #1e1e1e; color: #ddd; border: 1px solid #444; padding: 5px 6px; border-radius: 3px; font: inherit; }
  .frow[hidden] { display: none; }
  .modal-status { min-height: 18px; margin: 6px 0 10px; font-size: 12px; }
  .node .conn-status { float: right; padding: 0 10px; font-size: 12px; line-height: 20px; display: none; }
  .node .conn-status.show { display: inline; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btns button { background: #333; color: #ddd; border: 1px solid #444; border-radius: 3px; padding: 5px 14px; cursor: pointer; font: inherit; }
  .modal-btns button:hover { background: #0e639c; border-color: #0e639c; color: #fff; }
</style>
</head>
<body>
<header>
  <span class="title">⛁</span>
  <div id="conn"><div class="cur"></div><div class="menu"></div></div>
  <button id="connAdd" class="hbtn" title="Add connection">＋</button>
  <button id="connEdit" class="hbtn" title="Edit connection">✎</button>
  <button id="connDel" class="hbtn" title="Delete connection">🗑</button>
</header>

<!-- Connection settings modal (add / edit) -->
<div id="connModalBg" class="modal-bg">
  <div class="modal">
    <div class="modal-title" id="connModalTitle">Add connection</div>
    <div class="frow"><label>Name</label><input id="f_name"></div>
    <div class="frow"><label>Kind</label>
      <select id="f_kind"><option value="redis">redis</option><option value="mongo">mongo</option><option value="mysql">mysql</option><option value="zookeeper">zookeeper</option></select>
    </div>
    <div class="frow" data-show="redis,mysql,mongo-form,zookeeper"><label>Host</label><input id="f_host" placeholder="127.0.0.1"></div>
    <div class="frow" data-show="redis,mysql,mongo-form,zookeeper"><label>Port</label><input id="f_port" placeholder="6379"></div>
    <div class="frow" data-show="mysql,mongo-form"><label>User</label><input id="f_user"></div>
    <div class="frow" data-show="redis,mysql,mongo-form"><label>Auth</label><input id="f_auth" type="password"></div>
    <div class="frow" data-show="mongo-form"><label>DB</label><input id="f_db"></div>
    <div class="frow" data-show="mongo-url"><label>URI</label><input id="f_uri" placeholder="mongodb://user:pass@host:27017/admin"></div>
    <div class="frow" data-show="mongo-form,mongo-url"><label>Mode</label>
      <select id="f_mode"><option value="form">form</option><option value="url">url</option></select>
    </div>
    <div class="modal-status" id="connModalStatus"></div>
    <div class="modal-btns">
      <button id="connSaveBtn">OK</button>
      <button id="connTestBtn">Test</button>
      <button id="connCancelBtn">Cancel</button>
    </div>
  </div>
</div>
<main>
  <div id="sidebar">
    <div id="search"><input id="match" placeholder="search keys… (type to filter, or glob user:*)"><button id="treeReload" title="Reload data">⟳</button></div>
    <div id="keys"><div class="empty">loading…</div></div>
  </div>
  <div id="splitter"></div>
  <div id="content">
    <div class="meta" id="meta" style="display:none"><span class="badge" id="vtype"></span><span id="vkey"></span></div>
    <div id="value"><div class="empty">select a key</div></div>
    <div id="cmdbar">
      <div id="cmdout"></div>
      <div id="cmdin"><span>&gt;</span><input id="cmd" placeholder="raw redis command, e.g. GET foo"></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
// activeKey is the highlighted tree row for NON-virtualized backends (zk/mongo/
// mysql), whose rows are never recycled, so a live DOM reference is safe.
let activeKey = null;
// activeKeyStr is the highlighted redis key for the VIRTUALIZED tree, where rows
// are recycled on scroll — a DOM reference would dangle, so we track the key and
// re-apply the .active class whenever a row for it is (re)rendered.
let activeKeyStr = null;
let currentContainer = ''; // container of the last selected entry, for content/cmd
let currentEntry = '';     // last selected entry, to detect entry switches
let currentQuery = '';     // mongo filter typed in the query box (per entry)
let conns = [];            // [{name, kind}]

function params(container) {
  return `conn=${encodeURIComponent(connSel.value)}&container=${encodeURIComponent(container)}`;
}

// connKind returns the backend kind of the selected connection.
function connKind() {
  const c = conns[connSel.value];
  return c ? c.kind : 'redis';
}

// isRelational reports whether the backend lists entries as a flat list with a
// query bar and drop buttons (mongo collections / mysql tables), vs redis keys.
function isRelational() { return connKind() !== 'redis'; }

// hasQueryBar reports whether the content pane shows an editable query/filter bar.
// Only the relational backends (mysql SELECT / mongo find) take a query; zookeeper
// lists znodes as flat paths with no query, so its bar is suppressed.
function hasQueryBar() { return connKind() === 'mysql' || connKind() === 'mongo'; }

// canDeleteRows reports whether the table supports per-row deletion (mysql table
// rows located by primary key / mongo documents located by _id).
function canDeleteRows() { return connKind() === 'mysql' || connKind() === 'mongo'; }

// entryNoun / containerNoun give backend-appropriate labels for confirm dialogs.
function entryNoun() {
  switch (connKind()) {
    case 'mysql': return 'table';
    case 'zookeeper': return 'znode';
    default: return 'collection';
  }
}
function containerNoun() { return connKind() === 'zookeeper' ? 'znode' : 'database'; }

// kindColor tints a connection's dropdown entry by backend kind so
// redis/mongo/mysql are distinguishable by color (matches the TUI).
function kindColor(kind) {
  return {mongo: '#8bc99a', mysql: '#90caf9', zookeeper: '#c9a0dc'}[kind] || '#f6b8b1'; // default: light red (redis)
}

// connSel is a tiny compatibility shim over the custom dropdown so the rest of
// the code can keep reading/writing a numeric `.value` like a <select>. onchange
// is invoked on user selection (not on programmatic value set), matching <select>.
const connSel = {
  _i: 0,
  onchange: null,
  get value() { return this._i; },
  set value(i) { this._i = Number(i) || 0; this.render(); },
  // optLabel renders one entry: a fixed-width [KIND] tag (monospace-aligned) then
  // the name. The tag is colored by kind.
  _label(c) {
    const kind = c.kind || 'redis';
    const tag = ('[' + kind.toUpperCase() + ']').padEnd(8); // [REDIS]/[MONGO]/[MYSQL] -> aligned
    return {kind, tag, name: c.name};
  },
  render() {
    const cur = document.querySelector('#conn .cur');
    const menu = document.querySelector('#conn .menu');
    if (!conns.length) { cur.textContent = ''; menu.innerHTML = ''; return; }
    const c = conns[this._i] || conns[0];
    const L = this._label(c);
    cur.innerHTML = `<span style="color:${kindColor(L.kind)}">${L.tag}</span>${escapeHtml(L.name)}`;
    menu.innerHTML = conns.map((cc, i) => {
      const l = this._label(cc);
      return `<div class="opt${i === this._i ? ' sel' : ''}" data-i="${i}"><span style="color:${kindColor(l.kind)}">${l.tag}</span>${escapeHtml(l.name)}</div>`;
    }).join('');
  },
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}

async function loadConns() {
  const r = await fetch('/api/conns');
  const data = await r.json();
  conns = data.conns || [];
  // restore the connection selected on the last run.
  let sel = 0;
  if (data.selected >= 0 && data.selected < conns.length) sel = data.selected;
  connSel.value = sel; // also renders the dropdown
}

// buildTree splits keys on ':' into a folder tree, matching the terminal view.
function buildTree(keys) {
  const root = { children: new Map(), count: 0 };
  for (const key of keys) {
    const parts = key.split(':');
    let node = root, prefix = '';
    for (let i = 0; i < parts.length; i++) {
      prefix = i === 0 ? parts[0] : prefix + ':' + parts[i];
      const leaf = i === parts.length - 1;
      let child = node.children.get(parts[i]);
      if (!child) {
        child = { name: parts[i], key: prefix, leaf, children: new Map(), count: 0 };
        node.children.set(parts[i], child);
      }
      child.count++;
      node = child;
    }
  }
  return root;
}

// ---- Virtual-scrolled redis key tree --------------------------------------
// A redis db can hold millions of keys. Building one DOM node per tree node
// freezes the browser, so the ':'-split tree lives as an in-memory MODEL and
// only the rows visible in the #keys scroll viewport are rendered — mirroring
// the TUI, where tview paints only the on-screen rows. Other backends keep
// their plain rendering; their entry lists are small.

const OVERSCAN = 8; // rows rendered above/below the viewport to hide scroll seams

// activeScrollers holds every mounted virtual tree so the single #keys scroll
// listener can refresh each one's window; cleared when the tree is rebuilt.
let activeScrollers = [];

// buildTreeModel builds the ':'-split tree (see buildTree) for virtualization.
// Children are sorted and given parent/depth/collapsed LAZILY (see ensureKids)
// rather than up front: a 2M-key db has millions of nodes, and eagerly sorting
// every folder — most of which start collapsed and never render — is the bulk of
// the load stall. allExpanded=true (search) opens folders as they're walked.
function buildTreeModel(keys, allExpanded) {
  const root = buildTree(keys);
  root.depth = 1;               // entries (root's children) render at depth 2
  root.allExpanded = !!allExpanded;
  return root;
}

// ensureKids lazily materializes node.kids: the name-sorted child array, with
// each child's parent/depth set and folders' collapsed flag initialized. Cheap
// to call repeatedly (memoized on node.kids), so flatten can call it per visit.
function ensureKids(node, allExpanded) {
  if (node.kids) return node.kids;
  const kids = [...node.children.values()].sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
  const childDepth = (node.depth || 1) + 1;
  for (const c of kids) {
    c.parent = node;
    c.depth = childDepth;
    if (c.children.size > 0) c.collapsed = !allExpanded;
  }
  node.kids = kids;
  return kids;
}

// flattenTree walks the model depth-first, skipping the children of collapsed
// folders, to produce the ordered list of currently-visible rows. It sorts only
// the folders it actually descends into (via ensureKids), so a collapsed tree
// costs one top-level sort instead of a full-tree sort.
function flattenTree(root) {
  const out = [];
  const walk = node => {
    for (const c of ensureKids(node, root.allExpanded)) {
      out.push(c);
      if (c.children.size > 0 && !c.collapsed) walk(c);
    }
  };
  walk(root);
  return out;
}

// buildVirtualRow renders one model node into a tree row. Folders toggle their
// collapsed flag and reflow; leaves load content. The node key is stashed on the
// element (_key/_leaf) so active-highlight updates need no DOM query/escaping.
function buildVirtualRow(node, container, reflow) {
  const isFolder = node.children.size > 0;
  const closed = isFolder && node.collapsed;
  const { row } = makeRow(node.depth, isFolder ? (closed ? '▸' : '▾') : '·',
    node.name, isFolder, isFolder ? node.count : undefined);
  row.title = node.key;
  row._key = node.key;
  row._leaf = !isFolder;
  if (!isFolder && activeKeyStr != null && node.key === activeKeyStr) row.classList.add('active');
  if (isFolder) {
    row.onclick = e => { e.stopPropagation(); node.collapsed = !node.collapsed; reflow(); };
  } else {
    row.onclick = e => { e.stopPropagation(); loadContent(container, node.key, node.key, true); };
  }
  // Hover "×": a leaf DELs its one key; a folder (virtual prefix) DELs every key
  // under it (prefix:* plus an exact prefix key) in one server-side sweep.
  row.style.position = 'relative';
  const del = document.createElement('span');
  del.textContent = '×';
  del.title = isFolder ? 'Delete all keys under this prefix' : 'Delete key';
  del.style.cssText = 'float:right; color:#d33; font-weight:bold; padding:0 8px; display:none;';
  del.onclick = e => {
    e.stopPropagation();
    if (isFolder) dropRedisPrefix(container, node, reflow);
    else dropRedisKey(container, node, reflow);
  };
  row.onmouseenter = () => { del.style.display = 'inline'; };
  row.onmouseleave = () => { del.style.display = 'none'; };
  row.appendChild(del);
  return row;
}

// removeLeafFromModel detaches a leaf from the model: every ancestor's key count
// drops by 1 (the leaf counted toward each prefix it lived under), and any prefix
// folder left empty is spliced out of its parent. Walks parent links to the root.
function removeLeafFromModel(node) {
  // Decrement the prefix count on every ancestor up to (but not including) root.
  for (let a = node.parent; a && a.parent; a = a.parent) a.count -= 1;
  // Detach the leaf, then unlink any ancestor that became empty.
  let n = node;
  while (n.parent) {
    const p = n.parent;
    p.children.delete(n.name);
    if (p.kids) { const i = p.kids.indexOf(n); if (i >= 0) p.kids.splice(i, 1); }
    if (p.children.size > 0 || !p.parent) break; // p still has siblings, or is root
    n = p; // p emptied out — remove it from its own parent next
  }
}

// removeSubtreeFromModel detaches a whole prefix folder: each ancestor's count
// drops by the folder's key count, the folder is unlinked from its parent, and
// any ancestor left empty is pruned in turn (same cascade as removeLeafFromModel).
function removeSubtreeFromModel(node) {
  const n = node.count; // keys living under this prefix
  for (let a = node.parent; a && a.parent; a = a.parent) a.count -= n;
  let cur = node;
  while (cur.parent) {
    const p = cur.parent;
    p.children.delete(cur.name);
    if (p.kids) { const i = p.kids.indexOf(cur); if (i >= 0) p.kids.splice(i, 1); }
    if (p.children.size > 0 || !p.parent) break;
    cur = p;
  }
}

// subtreeHasActiveKey reports whether activeKeyStr (the key shown on the right)
// lives under node's prefix, so a prefix delete knows to clear the pane.
function subtreeHasActiveKey(node) {
  return activeKeyStr != null && (activeKeyStr === node.key || activeKeyStr.startsWith(node.key + ':'));
}

// dropRedisPrefix confirms, then deletes every key under a prefix folder via the
// server-side sweep (/api/dropprefix — never a DEL-per-key from the browser),
// removes the subtree from the model, and reflows. node.count keys are at stake,
// so the confirm spells out how many.
async function dropRedisPrefix(container, node, reflow) {
  if (!confirm(`Delete ALL ${node.count} key(s) under "${node.key}:"? This cannot be undone.`)) return;
  const r = await fetch(`/api/dropprefix?conn=${encodeURIComponent(connSel.value)}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ container, prefix: node.key })
  });
  const j = await r.json();
  if (j.error) { alert('Delete failed: ' + j.error); return; }
  if (subtreeHasActiveKey(node)) {
    activeKeyStr = null;
    $('value').innerHTML = '<div class="empty">select a key</div>';
    $('meta').style.display = 'none';
  }
  removeSubtreeFromModel(node);
  reflow();
}

// dropRedisKey confirms, DELs the key via /api/drop, then removes it from the
// in-memory tree model and reflows the virtual list. Clears the right pane if the
// deleted key was the one being shown.
async function dropRedisKey(container, node, reflow) {
  if (!confirm(`Delete key ${node.key}? This cannot be undone.`)) return;
  const r = await fetch(`/api/drop?conn=${encodeURIComponent(connSel.value)}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ container, entry: node.key })
  });
  const j = await r.json();
  if (j.error) { alert('Delete failed: ' + j.error); return; }
  if (activeKeyStr === node.key) {
    activeKeyStr = null;
    $('value').innerHTML = '<div class="empty">select a key</div>';
    $('meta').style.display = 'none';
  }
  removeLeafFromModel(node);
  reflow();
}

// mountVirtualTree replaces box's contents with a virtual scroller over root's
// visible rows. A spacer-sized box reserves the full scroll height; an absolutely
// positioned viewport, translated to the window start, holds only the rendered
// slice. Registered globally so the shared #keys scroll listener drives it.
function mountVirtualTree(box, root, container) {
  box.style.position = 'relative';
  box.innerHTML = '';
  const viewport = document.createElement('div');
  viewport.style.cssText = 'position:absolute; left:0; right:0; top:0;';
  box.appendChild(viewport);

  // rowH starts at a guess and is CALIBRATED from the first real rendered row's
  // measured height (line-height alone misses font/zoom/devicePixelRatio
  // effects). A wrong rowH mis-sizes the spacer so the absolute viewport overflows
  // onto the next db; calibrating from actual DOM makes spacer and content agree.
  const state = { box, viewport, rows: [], rowH: 20 };

  const render = () => {
    // A collapsed db (or hidden by search) has no offsetParent; render nothing
    // and keep the DOM empty so off-screen trees cost no rows.
    if (box.offsetParent === null) { viewport.innerHTML = ''; return; }
    const rows = state.rows, rowH = state.rowH;
    const keys = $('keys');
    const kr = keys.getBoundingClientRect();
    const br = box.getBoundingClientRect();
    // Box-local pixel span intersecting the scroll viewport.
    const topLocal = Math.max(0, kr.top - br.top);
    const botLocal = Math.max(0, kr.bottom - br.top);
    let start = Math.max(0, Math.floor(topLocal / rowH) - OVERSCAN);
    let end = Math.min(rows.length, Math.ceil(botLocal / rowH) + OVERSCAN);
    viewport.style.transform = `translateY(${start * rowH}px)`;
    viewport.innerHTML = '';
    for (let i = start; i < end; i++) {
      viewport.appendChild(buildVirtualRow(rows[i], container, reflow));
    }
    // Calibrate rowH from the first painted row, then re-lay if it disagrees with
    // the assumed height (one extra pass, only when the guess was wrong).
    if (viewport.firstChild) {
      const real = viewport.firstChild.getBoundingClientRect().height;
      if (real > 0 && Math.abs(real - rowH) > 0.5) {
        state.rowH = real;
        box.style.height = (rows.length * real) + 'px';
        render();
        return;
      }
    }
    // When the whole tree is rendered (small db: no row is virtualized away),
    // size the box from the viewport's REAL stacked height rather than
    // rows.length*rowH. Sub-pixel per-row rounding under display zoom/HiDPI makes
    // the estimate drift a few px short over many rows, which would pull the next
    // sibling (db1) up into the last key. The measured height is exact, so the
    // sibling sits flush below the last row.
    if (start === 0 && end === rows.length && viewport.offsetHeight > 0) {
      box.style.height = viewport.offsetHeight + 'px';
    }
  };

  const reflow = () => {
    state.rows = flattenTree(root);
    box.style.height = (state.rows.length * state.rowH) + 'px';
    render();
  };

  state.render = render;
  box._scroller = state;
  activeScrollers.push(state);
  reflow();
  return state;
}

// scheduleScrollerRender rAF-throttles window recomputation: scroll fires far
// faster than we need to repaint, so coalesce bursts into one frame.
let scrollerFrame = 0;
function scheduleScrollerRender() {
  if (scrollerFrame) return;
  scrollerFrame = requestAnimationFrame(() => {
    scrollerFrame = 0;
    for (const s of activeScrollers) s.render();
  });
}

// Drive every mounted virtual tree from the single #keys scroll container. The
// listener is attached once; per-db scrollers register/unregister in
// activeScrollers. A resize can change the viewport height, so refresh on that too.
$('keys').addEventListener('scroll', scheduleScrollerRender, { passive: true });
window.addEventListener('resize', scheduleScrollerRender);

// buildZKTree nests znode paths (split on '/') under a container root path.
// Unlike redis keys, every node is a real znode with its own data, so the
// renderer makes folders selectable too. rootPath is the container's own path
// (e.g. "/app"); only its descendants are nested below it.
function buildZKTree(paths, rootPath) {
  const root = { children: new Map(), count: 0 };
  const prefix = rootPath + '/';
  for (const p of paths) {
    if (!p.startsWith(prefix)) continue; // skip the container root and unrelated paths
    const parts = p.slice(prefix.length).split('/');
    let node = root, full = rootPath;
    for (let i = 0; i < parts.length; i++) {
      full = full + '/' + parts[i];
      const leaf = i === parts.length - 1;
      let child = node.children.get(parts[i]);
      if (!child) {
        child = { name: parts[i], key: full, leaf, children: new Map(), count: 0 };
        node.children.set(parts[i], child);
      }
      child.count++;
      node = child;
    }
  }
  return root;
}

// makeRow builds a single tree row with a twistie and label.
function makeRow(depth, twistie, label, isFolder, count) {
  const row = document.createElement('div');
  row.className = 'node' + (isFolder ? '' : ' leaf');
  row.style.paddingLeft = (depth * 14 + 4) + 'px';
  const tw = document.createElement('span');
  tw.className = 'tw';
  tw.textContent = twistie;
  const lab = document.createElement('span');
  lab.className = 'label';
  lab.textContent = label;
  row.appendChild(tw);
  row.appendChild(lab);
  if (count !== undefined) {
    const cnt = document.createElement('span');
    cnt.className = 'count';
    cnt.textContent = '(' + count + ')';
    row.appendChild(cnt);
  }
  return { row, tw };
}

// renderEntryNode renders the split-path entry tree under a container, depth >= 2.
// Folders (redis groupers and zookeeper parent znodes alike) only expand/collapse
// on click; only leaf nodes load content into the table on the right. When
// collapsed is true, sub-folders start closed so expanding a container reveals
// just its direct children (zookeeper); redis keeps its folders open.
function renderEntryNode(node, depth, container, collapsed) {
  const frag = document.createDocumentFragment();
  const names = [...node.children.keys()].sort();
  // Every zookeeper node is a real znode and can be deleted (recursively, with
  // its subtree); redis groupers are virtual prefixes, so no drop button there.
  const zk = connKind() === 'zookeeper';
  for (const name of names) {
    const n = node.children.get(name);
    const isFolder = n.children.size > 0;
    const closed = isFolder && collapsed;
    const { row, tw } = makeRow(depth, isFolder ? (closed ? '▸' : '▾') : '·', name, isFolder, isFolder ? n.count : undefined);
    row.title = n.key;
    let kids = null;
    if (isFolder) {
      kids = document.createElement('div');
      kids.className = collapsed ? 'children collapsed' : 'children';
      kids.appendChild(renderEntryNode(n, depth + 1, container, collapsed));
      const toggle = () => {
        kids.classList.toggle('collapsed');
        tw.textContent = kids.classList.contains('collapsed') ? '▸' : '▾';
      };
      // A folder znode click only expands/collapses; its data is not shown on the
      // right. Only leaf znodes load content into the table.
      row.onclick = e => { e.stopPropagation(); toggle(); };
    } else {
      row.onclick = e => { e.stopPropagation(); loadContent(container, n.key, row, true); };
    }
    if (zk) {
      // Every znode (folder or leaf) gets hover actions: reload its own subtree /
      // value, and drop it (with its subtree). depth is captured so a folder
      // reload can rebuild its children at the right indent.
      row.style.position = 'relative';
      row.appendChild(zkRowActions(container, n.key, row, kids, depth));
    }
    frag.appendChild(row);
    if (kids) frag.appendChild(kids);
  }
  return frag;
}

// zkRowActions builds the hover action group (reload + drop) shown on a znode
// row. kids is the row's nested children container (null for a leaf); depth is
// the row's indent level, used to rebuild a folder's subtree.
function zkRowActions(container, path, row, kids, depth) {
  const group = document.createElement('span');
  group.style.cssText = 'float:right; display:none;';
  const reload = document.createElement('span');
  reload.textContent = '⟳';
  reload.title = 'Reload ' + entryNoun();
  reload.style.cssText = 'color:#8ab4f8; font-weight:bold; padding:0 6px; cursor:pointer;';
  reload.onclick = e => { e.stopPropagation(); reloadZNode(container, path, row, kids, depth); };
  const del = document.createElement('span');
  del.textContent = '×';
  del.title = 'Drop ' + entryNoun();
  del.style.cssText = 'color:#d33; font-weight:bold; padding:0 8px; cursor:pointer;';
  del.onclick = e => { e.stopPropagation(); dropZNode(container, path, row, kids); };
  group.appendChild(reload);
  group.appendChild(del);
  row.onmouseenter = () => { group.style.display = 'inline'; };
  row.onmouseleave = () => { group.style.display = 'none'; };
  return group;
}

// reloadZNode re-fetches the container's znode subtree and rebuilds this node's
// part of it: a folder's children group is repopulated from the fresh paths; a
// leaf's currently-shown value is re-loaded into the right pane. The folder's
// expand/collapse state is preserved.
async function reloadZNode(container, path, row, kids, depth) {
  if (kids) {
    const wasCollapsed = kids.classList.contains('collapsed');
    try {
      const match = $('match').value || '*';
      const r = await fetch(`/api/entries?${params(container)}&match=${encodeURIComponent(match)}`);
      const entries = await r.json();
      if (entries.error) { alert('Reload failed: ' + entries.error); return; }
      kids.innerHTML = '';
      // Rebuild only the subtree rooted at this folder's path. Children start
      // collapsed (matching initial nesting); restore this folder's own state.
      kids.appendChild(renderEntryNode(buildZKTree(entries, path), depth + 1, container, true));
      kids.classList.toggle('collapsed', wasCollapsed);
    } catch (e) { alert('Reload failed: ' + e); }
    return;
  }
  // Leaf: only refresh the pane if this node's value is what's shown.
  if (activeKey === row) loadContent(container, path, row, true);
}

// dropZNode confirms and deletes a znode (and its entire subtree) by full path,
// then removes its row — and any nested children group — from the tree.
async function dropZNode(container, path, row, kids) {
  if (!confirm(`Drop ${entryNoun()} ${path}? This removes it and all descendants and cannot be undone.`)) return;
  const r = await fetch(`/api/drop?conn=${encodeURIComponent(connSel.value)}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ container, entry: path })
  });
  const j = await r.json();
  if (j.error) { alert('Drop failed: ' + j.error); return; }
  row.remove();
  if (kids) kids.remove();
  if (activeKey === row) { $('value').innerHTML = '<div class="empty">select a key</div>'; $('meta').style.display = 'none'; }
}

// renderFlatEntries renders entries as flat leaves (mongo collections, no ':' split).
// Each collection gets a hover "×" button to drop it.
function renderFlatEntries(entries, container) {
  const frag = document.createDocumentFragment();
  for (const name of [...entries].sort()) {
    const { row } = makeRow(2, '·', name, false);
    row.title = name;
    row.style.position = 'relative';
    row.onclick = e => { e.stopPropagation(); loadContent(container, name, row, true); };
    const del = document.createElement('span');
    del.textContent = '×';
    del.title = 'Drop ' + entryNoun();
    del.style.cssText = 'float:right; color:#d33; font-weight:bold; padding:0 8px; display:none;';
    del.onclick = e => { e.stopPropagation(); dropCollection(container, name, row); };
    row.onmouseenter = () => { del.style.display = 'inline'; };
    row.onmouseleave = () => { del.style.display = 'none'; };
    row.appendChild(del);
    frag.appendChild(row);
  }
  return frag;
}

// dropCollection confirms and drops a mongo collection, then refreshes the tree.
async function dropCollection(container, name, row) {
  if (!confirm(`Drop ${entryNoun()} ${container}.${name}? This cannot be undone.`)) return;
  const r = await fetch(`/api/drop?conn=${encodeURIComponent(connSel.value)}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ container, entry: name })
  });
  const j = await r.json();
  if (j.error) { alert('Drop failed: ' + j.error); return; }
  row.remove();
  if (activeKey === row) { $('value').innerHTML = '<div class="empty">select a key</div>'; $('meta').style.display = 'none'; }
}

// dropDatabase confirms and drops a mongo database, then removes it from the tree.
async function dropDatabase(container, row, kids) {
  if (!confirm(`Drop ${containerNoun()} ${container}? This removes ALL ${entryNoun()}s and cannot be undone.`)) return;
  const r = await fetch(`/api/dropdb?conn=${encodeURIComponent(connSel.value)}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ container })
  });
  const j = await r.json();
  if (j.error) { alert('Drop failed: ' + j.error); return; }
  row.remove();
  if (kids) kids.remove();
  $('value').innerHTML = '<div class="empty">select a key</div>';
  $('meta').style.display = 'none';
}

// teardownScroller unregisters and detaches any virtual scroller previously
// mounted in box, so re-rendering a redis db (reload, search) doesn't leak the
// stale scroller into the shared #keys scroll listener.
function teardownScroller(box) {
  if (!box._scroller) return;
  activeScrollers = activeScrollers.filter(s => s !== box._scroller);
  box._scroller = null;
  box.style.height = '';
  box.style.position = '';
}

// renderEntries paints a container's already-fetched entry list into box. When
// expand is true (active search) nested folders start open so deep matches are
// visible instead of being hidden under collapsed parents. The redis ':'-tree is
// virtual-scrolled (only visible rows hit the DOM); other backends render plainly.
function renderEntries(container, box, entries, expand) {
  teardownScroller(box);
  box.innerHTML = '';
  if (!entries.length) { box.innerHTML = '<div class="empty" style="padding:4px 10px">empty</div>'; return; }
  if (connKind() === 'zookeeper') {
    // znode paths nest on '/'; the container is itself a znode, so its row
    // loads the container's data and its descendants nest beneath it.
    box.appendChild(renderEntryNode(buildZKTree(entries, '/' + container), 2, container, !expand));
  } else if (isRelational()) {
    box.appendChild(renderFlatEntries(entries, container));
  } else {
    // redis prefix-folders start collapsed so expanding a db shows only its
    // direct children; during a search (expand) they open so nested hits show.
    mountVirtualTree(box, buildTreeModel(entries, !!expand), container);
  }
}

// loadEntries fetches entries for a container and renders the entry tree.
async function loadEntries(container, box, tw, quiet, expand) {
  // quiet (live search re-filter) keeps the old list in place until the new one
  // arrives, so the tree doesn't flash a short "loading…" line and shift.
  if (!quiet) { teardownScroller(box); box.innerHTML = '<div class="empty" style="padding:4px 10px">loading…</div>'; }
  const match = $('match').value || '*';
  try {
    const r = await fetch(`/api/entries?${params(container)}&match=${encodeURIComponent(match)}`);
    const entries = await r.json();
    if (entries.error) { box.innerHTML = `<div class="empty" style="padding:4px 10px">${entries.error}</div>`; return; }
    renderEntries(container, box, entries, expand);
  } catch (e) { box.innerHTML = `<div class="empty" style="padding:4px 10px">${e}</div>`; }
}

// loadKeys builds the server > container tree; entries load lazily on expand.
async function loadKeys() {
  const box = $('keys');
  // Rebuilding #keys orphans every mounted scroller; drop them so the shared
  // scroll listener doesn't touch detached boxes.
  activeScrollers = [];
  box.innerHTML = '<div class="empty">loading…</div>';
  activeKey = null;
  activeKeyStr = null;
  // The bottom command bar is redis-only now; mongo/mysql use the single Query
  // box above the table (which also runs non-table commands).
  $('cmdbar').style.display = isRelational() ? 'none' : '';
  $('cmd').placeholder = 'raw redis command, e.g. GET foo';
  try {
    box.innerHTML = '';
    const sel = conns[connSel.value];
    const server = sel ? sel.name : '';
    const { row: srow, tw: stw } = makeRow(0, '▾', server, true);
    // Connection-status dot, right-aligned on the server (root) row, mirroring the
    // TUI's root glyph. The poll loop updates it via connStatusEl; it survives tree
    // rebuilds because loadKeys re-creates the row (and re-applies the last state).
    const dot = document.createElement('span');
    dot.className = 'conn-status';
    srow.appendChild(dot);
    connStatusEl = dot;
    applyConnStatus();
    box.appendChild(srow);
    // Containers live in a child group under the server row so the whole tree
    // collapses from its first level.
    const serverKids = document.createElement('div');
    serverKids.className = 'children';
    srow.onclick = e => {
      e.stopPropagation();
      const open = serverKids.classList.toggle('collapsed') === false;
      stw.textContent = open ? '▾' : '▸';
    };
    box.appendChild(serverKids);
    const r = await fetch(`/api/containers?conn=${encodeURIComponent(connSel.value)}`);
    const containers = await r.json();
    // Connection down / unreachable: leave the tree showing just the server row so
    // the health-poll dot (red ✖) conveys the state, instead of dumping the raw
    // backend error (e.g. "resp: invalid syntax") into the tree.
    if (containers.error) { pingOnce(connSel.value); return; }
    containers.forEach((container, i) => {
      const { row, tw } = makeRow(1, '▸', container, true);
      const kids = document.createElement('div');
      kids.className = 'children collapsed';
      kids.dataset.container = container; // lets live search re-filter this group
      let loaded = false;
      const toggleKids = () => {
        const open = kids.classList.toggle('collapsed') === false;
        tw.textContent = open ? '▾' : '▸';
        if (open && !loaded) { loaded = true; loadEntries(container, kids, tw); }
        // Re-expanding a redis db reveals a box whose virtual viewport was emptied
        // while hidden; repaint its window now instead of waiting for a scroll.
        else if (open && kids._scroller) scheduleScrollerRender();
      };
      row.onclick = e => { e.stopPropagation(); toggleKids(); };
      if (connKind() === 'zookeeper') {
        // A zookeeper container is itself a znode: reload re-fetches its subtree
        // (only if already expanded/loaded); drop removes it and all descendants.
        row.style.position = 'relative';
        const group = document.createElement('span');
        group.style.cssText = 'float:right; display:none;';
        const reload = document.createElement('span');
        reload.textContent = '⟳';
        reload.title = 'Reload ' + entryNoun();
        reload.style.cssText = 'color:#8ab4f8; font-weight:bold; padding:0 6px; cursor:pointer;';
        reload.onclick = e => { e.stopPropagation(); if (loaded) loadEntries(container, kids, tw, true); };
        const del = document.createElement('span');
        del.textContent = '×';
        del.title = 'Drop ' + entryNoun();
        del.style.cssText = 'color:#d33; font-weight:bold; padding:0 8px; cursor:pointer;';
        del.onclick = e => { e.stopPropagation(); dropZNode(container, '/' + container, row, kids); };
        group.appendChild(reload);
        group.appendChild(del);
        row.onmouseenter = () => { group.style.display = 'inline'; };
        row.onmouseleave = () => { group.style.display = 'none'; };
        row.appendChild(group);
      } else if (isRelational()) {
        const del = document.createElement('span');
        del.textContent = '×';
        del.title = 'Drop ' + containerNoun();
        del.style.cssText = 'float:right; color:#d33; font-weight:bold; padding:0 8px; display:none;';
        del.onclick = e => { e.stopPropagation(); dropDatabase(container, row, kids); };
        row.onmouseenter = () => { del.style.display = 'inline'; };
        row.onmouseleave = () => { del.style.display = 'none'; };
        row.appendChild(del);
      }
      serverKids.appendChild(row);
      serverKids.appendChild(kids);
      if (i === 0) row.click(); // expand the first container by default
    });
  } catch (e) { box.innerHTML = `<div class="empty">${e}</div>`; }
}

// pending holds staged (uncommitted) cell edits for the current entry,
// keyed by "row,col" → { td, orig, value, rowIdx, colIdx, oldRow, type }.
let pending = new Map();
let pendingCtx = null; // { container, entry, columns }

// selectedRows holds the row indices ticked for deletion (mysql/mongo only),
// alongside the rows/cellTypes captured when the table was rendered.
let selectedRows = new Set();
let deleteCtx = null; // { rows, cellTypes }
let currentRowCount = 0; // rows shown in the active table, for the idle toolbar label

function renderContent(c) {
  $('meta').style.display = 'flex';
  $('vtype').textContent = c.type;
  $('vkey').textContent = c.entry;
  const box = $('value');
  pending = new Map();
  pendingCtx = null;
  selectedRows = new Set();
  deleteCtx = null;
  if (c.kind === 'text') {
    // zookeeper znode data is editable multi-line text with a Save button; other
    // backends' text stays read-only.
    if (connKind() === 'zookeeper') { renderZNodeText(c, box); return; }
    box.innerHTML = '<pre style="padding-top:12px"></pre>';
    box.firstChild.textContent = c.text ?? '(nil)';
    return;
  }
  if (c.type === 'stream') { renderStream(c, box); return; }
  // table
  const cols = c.columns || [];
  const rows = c.rows || [];
  const cellTypes = c.cellTypes || [];
  const readOnly = c.readOnly || [];
  pendingCtx = { container: currentContainer, entry: c.entry, columns: cols };
  currentRowCount = rows.length;
  const rowDelete = canDeleteRows();
  if (rowDelete) deleteCtx = { rows, cellTypes };

  box.innerHTML = '';
  box.style.setProperty('--qh', '0px');
  // Prefill the query box with the full statement the backend ran (SELECT ... /
  // db.coll.find(...)) only when the box is empty — i.e. on a fresh key switch,
  // where loadContent cleared currentQuery. When the user ran their own
  // statement, currentQuery holds their exact input (newlines and all), so keep
  // it rather than overwrite with the backend's normalized single line.
  let qbar = null;
  if (hasQueryBar()) {
    if (!currentQuery) currentQuery = c.query || '';
    qbar = buildQueryBar();
    box.appendChild(qbar);
  }
  box.appendChild(buildToolbar());
  const table = document.createElement('table');
  const head = document.createElement('tr');
  let selectAll = null;
  if (rowDelete) {
    const th = document.createElement('th');
    th.style.width = '1%';
    selectAll = document.createElement('input');
    selectAll.type = 'checkbox';
    selectAll.title = 'Select all';
    selectAll.onclick = () => {
      table.querySelectorAll('tr > td:first-child input[type=checkbox]').forEach((cb, i) => {
        cb.checked = selectAll.checked;
        if (selectAll.checked) selectedRows.add(i); else selectedRows.delete(i);
      });
      updateToolbar();
    };
    th.appendChild(selectAll);
    head.appendChild(th);
  }
  // columns auto-size to content (table-layout:auto); the drag grip lets the
  // user pin an explicit width when they want to widen/narrow a column.
  ['#', ...cols].forEach((col, k) => {
    const th = document.createElement('th');
    th.textContent = col;
    if (k > 0) addColResizer(th);
    head.appendChild(th);
  });
  table.appendChild(head);
  rows.forEach((row, i) => {
    const tr = document.createElement('tr');
    if (rowDelete) {
      const selTd = document.createElement('td');
      selTd.style.textAlign = 'center';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.onclick = () => {
        if (cb.checked) selectedRows.add(i); else selectedRows.delete(i);
        if (selectAll) selectAll.checked = selectedRows.size === rows.length;
        updateToolbar();
      };
      selTd.appendChild(cb);
      tr.appendChild(selTd);
    }
    const idx = document.createElement('td');
    idx.textContent = i + 1;
    tr.appendChild(idx);
    row.forEach((cell, j) => {
      const td = document.createElement('td');
      td.textContent = cell;
      const type = (cellTypes[i] && cellTypes[i][j]) || '';
      // tooltip shows the full value (and type) since long cells are truncated
      td.title = type ? `${cell}\n(${type})` : cell;
      const col = cols[j];
      const editable = col !== '_id' && !readOnly.includes(col);
      if (editable) {
        td.style.cursor = 'pointer';
        const rowTypes = cellTypes[i] || [];
        td.ondblclick = () => editCell(td, row, rowTypes, i, j, type);
      }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  box.appendChild(table);
  updateToolbar();
  // Pin the sticky header right below the sticky query bar by publishing the
  // bar's measured height; the qout text area can change it, so re-measure.
  if (qbar) {
    const setQH = () => box.style.setProperty('--qh', qbar.offsetHeight + 'px');
    setQH();
    new ResizeObserver(setQH).observe(qbar);
  }
}

// renderZNodeText shows a zookeeper znode's data in an editable multi-line
// textarea with a Save button that writes the full new value back via /api/update.
function renderZNodeText(c, box) {
  box.innerHTML = '';
  box.style.setProperty('--qh', '0px');
  const ta = document.createElement('textarea');
  ta.value = c.text ?? '';
  ta.spellcheck = false;
  ta.style.cssText = 'width:100%; box-sizing:border-box; min-height:240px; margin-top:10px; resize:vertical; '
    + 'background:#1e1e1e; color:#ddd; border:1px solid #3a3d41; border-radius:3px; padding:8px; '
    + 'font:13px/1.5 monospace;';
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex; gap:8px; align-items:center; padding:8px 0;';
  const save = document.createElement('button');
  save.textContent = 'Save';
  save.style.cssText = 'background:#0e639c; color:#fff; border:none; padding:4px 14px; border-radius:3px; cursor:pointer; font:inherit;';
  const status = document.createElement('span');
  status.style.cssText = 'color:#8bc99a;';
  const container = currentContainer, entry = c.entry;
  save.onclick = async () => {
    status.style.color = '#8bc99a'; status.textContent = '';
    const r = await fetch(`/api/update?conn=${encodeURIComponent(connSel.value)}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ container, entry, columns: ['value'], row: 0, column: 0,
        oldRow: [c.text ?? ''], value: ta.value, oldType: '' })
    });
    const j = await r.json();
    if (j.error) { status.style.color = '#d33'; status.textContent = 'Save failed: ' + j.error; return; }
    c.text = ta.value; // update baseline so a later save sends the right oldRow
    status.textContent = 'Saved';
  };
  bar.appendChild(save);
  bar.appendChild(status);
  box.appendChild(ta);
  box.appendChild(bar);
}

// fmtStreamId renders a stream entry ID "<ms>-<seq>" as a human time over the
// raw id (the ms part is a unix-millis timestamp). Non-standard ids pass through.
function fmtStreamId(id) {
  const dash = id.indexOf('-');
  const msPart = dash >= 0 ? id.slice(0, dash) : id;
  const ms = Number(msPart);
  if (!Number.isFinite(ms) || msPart === '' || !/^\d+$/.test(msPart)) return { time: '', raw: id };
  const d = new Date(ms);
  const time = d.toLocaleString(undefined, {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  });
  return { time, raw: id };
}

// renderStream renders a redis stream: a formatted Entry ID column, one column
// per field, and a per-row trash button that XDELs the entry.
function renderStream(c, box) {
  const cols = c.columns || []; // ["id", field1, field2, …]
  const rows = c.rows || [];
  box.innerHTML = '';
  box.style.setProperty('--qh', '0px');
  const table = document.createElement('table');
  const head = document.createElement('tr');
  ['Entry ID', ...cols.slice(1)].forEach((col, k) => {
    const th = document.createElement('th');
    th.textContent = col;
    if (k > 0) addColResizer(th);
    head.appendChild(th);
  });
  head.appendChild(document.createElement('th')); // delete column
  table.appendChild(head);
  rows.forEach(row => {
    const id = row[0];
    const tr = document.createElement('tr');
    const idTd = document.createElement('td');
    const { time, raw } = fmtStreamId(id);
    if (time) {
      const t = document.createElement('div'); t.textContent = time;
      const r = document.createElement('div'); r.textContent = raw;
      r.style.cssText = 'color:#888; font-size:11px;';
      idTd.appendChild(t); idTd.appendChild(r);
    } else {
      idTd.textContent = raw;
    }
    idTd.title = raw;
    tr.appendChild(idTd);
    row.slice(1).forEach(cell => {
      const td = document.createElement('td');
      td.textContent = cell;
      td.title = cell;
      tr.appendChild(td);
    });
    const delTd = document.createElement('td');
    delTd.style.textAlign = 'center';
    const del = document.createElement('span');
    del.textContent = '🗑';
    del.title = 'Delete entry';
    del.style.cssText = 'cursor:pointer; opacity:.6;';
    del.onmouseenter = () => del.style.opacity = '1';
    del.onmouseleave = () => del.style.opacity = '.6';
    del.onclick = () => delStreamEntry(c.entry, id, tr);
    delTd.appendChild(del);
    tr.appendChild(delTd);
    table.appendChild(tr);
  });
  box.appendChild(table);
}

// delStreamEntry XDELs one stream entry (via the raw-command endpoint) and
// removes its row on success.
async function delStreamEntry(entry, id, tr) {
  if (!confirm(`Delete stream entry ${id}?`)) return;
  const r = await fetch(`/api/cmd?${params(currentContainer)}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ cmd: `XDEL ${entry} ${id}` })
  });
  const j = await r.json();
  if (j.error) { alert('Delete failed: ' + j.error); return; }
  tr.remove();
}

// addColResizer attaches a drag handle to a header cell for manual column resize.
function addColResizer(th) {
  const grip = document.createElement('span');
  grip.className = 'rs';
  grip.onmousedown = e => {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.pageX;
    const startW = th.offsetWidth;
    const onMove = ev => {
      const w = Math.max(40, startW + ev.pageX - startX);
      th.style.width = w + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
  th.appendChild(grip);
}

// initSidebarResize wires the splitter between the sidebar and content so the
// user can drag it to resize the key tree, mirroring the TUI. The chosen width
// is clamped to keep both panels usable and persisted across reloads.
function initSidebarResize() {
  const sp = $('splitter'), sb = $('sidebar');
  if (!sp || !sb) return;
  const MIN_LEFT = 140, MIN_RIGHT = 240;
  const saved = parseInt(localStorage.getItem('sidebarWidth') || '', 10);
  if (saved > 0) sb.style.width = saved + 'px';
  sp.addEventListener('mousedown', e => {
    e.preventDefault();
    const main = sb.parentElement;
    const startX = e.pageX, startW = sb.offsetWidth;
    sp.classList.add('dragging');
    document.body.classList.add('col-resizing');
    const onMove = ev => {
      const maxLeft = main.clientWidth - MIN_RIGHT;
      let w = startW + ev.pageX - startX;
      w = Math.max(MIN_LEFT, Math.min(w, maxLeft));
      sb.style.width = w + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      sp.classList.remove('dragging');
      document.body.classList.remove('col-resizing');
      localStorage.setItem('sidebarWidth', sb.offsetWidth);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}
initSidebarResize();

// buildQueryBar renders the single query box shown above the table for
// mongo/mysql. It replaces the old bottom command console: a table-shaped
// statement (find / SELECT / bare filter) refreshes the table, while any other
// command (count, runCommand, SHOW, …) prints its result in the text area just
// below the box. Enter runs; empty matches all.
function buildQueryBar() {
  const wrap = document.createElement('div');
  wrap.className = 'qbar';
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex; gap:6px; align-items:flex-start;';
  const label = document.createElement('span');
  label.textContent = 'Query';
  label.style.cssText = 'color:#9cdcfe; padding-top:6px;';
  // A textarea (not an input) so it grows with multi-line statements. Enter
  // runs; Shift+Enter inserts a newline. It auto-grows to fit its content (up to
  // a cap, then scrolls) and can still be dragged taller manually.
  const input = document.createElement('textarea');
  input.id = 'qbox';
  input.rows = 1;
  input.value = currentQuery;
  input.placeholder = connKind() === 'mysql'
    ? 'WHERE id = 1   ·   SELECT …   ·   SHOW INDEX …  —  Enter to run (Shift+Enter = newline)'
    : 'db.coll.find({})   ·   db.coll.count()   ·   db.runCommand({…})  —  Enter to run (Shift+Enter = newline)';
  input.style.cssText = 'flex:1; min-height:30px; max-height:240px; background:#1e1e1e; color:#ddd; border:1px solid #444; padding:5px 7px; border-radius:3px; font:inherit; resize:vertical; white-space:pre; overflow:auto; box-sizing:border-box;';
  // autoGrow resizes the box to fit its content so new lines lift the bottom
  // edge, capped by max-height (then it scrolls). Manual drag still works but is
  // reset on the next keystroke.
  const autoGrow = () => {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  };
  input.oninput = autoGrow;
  requestAnimationFrame(autoGrow); // fit the prefilled statement on first render
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      runQueryBox(input.value);
    }
  };
  bar.appendChild(label);
  bar.appendChild(input);
  // Text output for non-table commands; hidden until something is printed.
  const out = document.createElement('pre');
  out.id = 'qout';
  out.style.cssText = 'display:none; margin:6px 0 0; max-height:160px; overflow:auto; background:#1e1e1e; border:1px solid #444; border-radius:3px; padding:6px 8px; color:#9cdcfe; white-space:pre-wrap; word-break:break-all;';
  wrap.appendChild(bar);
  wrap.appendChild(out);
  return wrap;
}

// isTableQuery reports whether a query box statement should refresh the table
// (handled by /api/content) rather than print text (handled by /api/cmd).
// Table-shaped: empty, a bare mongo filter, find(...), a WHERE fragment, or a
// SELECT. Everything else (count/runCommand/findOne, SHOW/DESCRIBE/EXPLAIN) is
// a command whose output is shown as text.
function isTableQuery(q) {
  const s = q.trim();
  if (s === '') return true;
  if (connKind() === 'mysql') {
    return /^(where|select)\b/i.test(s);
  }
  // mongo
  if (s[0] === '{') return true;
  return /^db\.[\w.$]+\.find\s*\(/.test(s);
}

// runQueryBox dispatches a query box submission: table-shaped statements reload
// the table via the content endpoint; other commands run via /api/cmd and print
// to the text area under the box.
async function runQueryBox(raw) {
  const q = raw.trim();
  const out = $('qout');
  if (isTableQuery(q)) {
    if (out) out.style.display = 'none';
    currentQuery = q;
    loadContent(pendingCtx.container, pendingCtx.entry, currentSel());
    return;
  }
  if (!out) return;
  out.style.display = 'block';
  out.textContent = '> ' + q + '\n';
  try {
    const r = await fetch(`/api/cmd?${params(currentContainer)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: q })
    });
    const j = await r.json();
    out.textContent += j.error ? `(error) ${j.error}` : j.reply;
  } catch (e) {
    out.textContent += String(e);
  }
  out.scrollTop = out.scrollHeight;
}

// buildToolbar renders the commit/rollback bar shown above the table.
function buildToolbar() {
  const bar = document.createElement('div');
  bar.id = 'editbar';
  // min-height reserves a constant button-row height so toggling buttons on/off
  // (e.g. Delete appearing on selection) never grows the bar and pushes the
  // table down.
  bar.style.cssText = 'display:none; gap:8px; align-items:center; padding:0 12px; box-sizing:border-box; min-height:26px;';
  // Row-count label shown when the bar is otherwise empty (no edits, no ticks),
  // so the reserved row isn't blank.
  const info = document.createElement('span');
  info.id = 'editinfo';
  info.style.cssText = 'color:#888;';
  const count = document.createElement('span');
  count.id = 'editcount';
  count.style.cssText = 'background:#f5c518; color:#000; border-radius:10px; padding:1px 9px; font-weight:bold;';
  const commit = document.createElement('button');
  commit.textContent = 'Commit';
  commit.style.cssText = 'background:#0e639c; color:#fff; border:none; padding:4px 12px; border-radius:3px; cursor:pointer; font:inherit;';
  commit.onclick = commitPending;
  const rollback = document.createElement('button');
  rollback.textContent = 'Rollback';
  rollback.style.cssText = 'background:#3a3d41; color:#ddd; border:none; padding:4px 12px; border-radius:3px; cursor:pointer; font:inherit;';
  rollback.onclick = () => loadContent(pendingCtx.container, pendingCtx.entry, currentSel());
  const del = document.createElement('button');
  del.id = 'editdelete';
  del.style.cssText = 'display:none; background:#a1260d; color:#fff; border:none; padding:4px 12px; border-radius:3px; cursor:pointer; font:inherit;';
  del.onclick = deleteSelectedRows;
  bar.appendChild(info);
  bar.appendChild(count);
  bar.appendChild(commit);
  bar.appendChild(rollback);
  bar.appendChild(del);
  return bar;
}

// updateToolbar toggles the toolbar buttons based on pending edits and ticked
// rows. The bar itself stays visible (its row is reserved) so the layout doesn't
// jump; Commit/Rollback appear only with staged edits, Delete only with ticks.
function updateToolbar() {
  const bar = $('editbar');
  if (!bar) return;
  const hasEdits = pending.size > 0;
  const hasSel = selectedRows.size > 0;
  bar.style.display = 'flex';
  $('editcount').textContent = pending.size;
  $('editcount').style.display = hasEdits ? '' : 'none';
  bar.querySelector('button:nth-of-type(1)').style.display = hasEdits ? '' : 'none'; // Commit
  bar.querySelector('button:nth-of-type(2)').style.display = hasEdits ? '' : 'none'; // Rollback
  const del = $('editdelete');
  del.style.display = hasSel ? '' : 'none';
  del.textContent = `Delete selected (${selectedRows.size})`;
  // When nothing is staged or ticked, fill the reserved row with the row count.
  const info = $('editinfo');
  if (info) {
    const idle = !hasEdits && !hasSel;
    info.style.display = idle ? '' : 'none';
    info.textContent = `${currentRowCount} row${currentRowCount === 1 ? '' : 's'}`;
  }
  // Publish the toolbar's height so the sticky table header pins below it.
  $('value').style.setProperty('--eh', bar.offsetHeight + 'px');
}

// editCell swaps a table cell into an input and stages (does not save) the change.
function editCell(td, row, rowTypes, rowIdx, colIdx, type) {
  const key = rowIdx + ',' + colIdx;
  const staged = pending.get(key);
  const orig = staged ? staged.orig : td.textContent;
  const input = document.createElement('input');
  input.value = td.textContent;
  input.style.width = '100%';
  input.style.font = 'inherit';
  input.style.background = '#1e1e1e';
  input.style.color = '#ddd';
  input.style.border = '1px solid #007acc';
  td.textContent = '';
  td.appendChild(input);
  input.focus();
  input.select();
  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    const val = commit ? input.value : orig;
    td.textContent = val;
    if (val === orig) {
      pending.delete(key);
      td.style.background = '';
      td.style.color = '';
    } else {
      pending.set(key, { orig, value: val, rowIdx, colIdx, oldRow: row, oldRowTypes: rowTypes, type });
      td.style.background = '#f5c518';
      td.style.color = '#000';
    }
    updateToolbar();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
  input.onblur = () => finish(true);
}

// commitPending POSTs every staged edit, then refreshes the entry.
async function commitPending() {
  if (!pendingCtx || pending.size === 0) return;
  for (const e of pending.values()) {
    const r = await fetch(`/api/update?conn=${encodeURIComponent(connSel.value)}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        container: pendingCtx.container, entry: pendingCtx.entry,
        columns: pendingCtx.columns, row: e.rowIdx, column: e.colIdx,
        oldRow: e.oldRow, oldRowTypes: e.oldRowTypes, value: e.value, oldType: e.type,
      })
    });
    const j = await r.json();
    if (j.error) { alert('Commit failed: ' + j.error); return; }
  }
  loadContent(pendingCtx.container, pendingCtx.entry, currentSel());
}

// deleteSelectedRows POSTs the ticked rows to /api/deleterows, then refreshes.
async function deleteSelectedRows() {
  if (!pendingCtx || !deleteCtx || selectedRows.size === 0) return;
  if (!confirm(`Delete ${selectedRows.size} selected row(s)? This cannot be undone.`)) return;
  const rows = [...selectedRows].sort((a, b) => a - b).map(i => ({
    oldRow: deleteCtx.rows[i],
    oldRowTypes: deleteCtx.cellTypes[i] || [],
  }));
  const r = await fetch(`/api/deleterows?conn=${encodeURIComponent(connSel.value)}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      container: pendingCtx.container, entry: pendingCtx.entry,
      columns: pendingCtx.columns, rows,
    })
  });
  const j = await r.json();
  if (j.error) { alert('Delete failed: ' + j.error); return; }
  loadContent(pendingCtx.container, pendingCtx.entry, currentSel());
}

// markActiveRows re-applies the .active class to whichever currently-rendered
// virtual rows match activeKeyStr (and clears it from the rest). Called after
// every window render so the highlight follows the selected key as rows recycle.
// currentSel returns the selector to re-pass to loadContent on a reload (commit /
// rollback / query re-run): the redis key string if the virtual tree holds the
// selection, else the live DOM row for other backends.
function currentSel() { return activeKeyStr != null ? activeKeyStr : activeKey; }

function markActiveRows() {
  for (const s of activeScrollers) {
    for (const row of s.viewport.children) {
      if (row._leaf) row.classList.toggle('active', row._key === activeKeyStr);
    }
  }
}

// loadContent loads an entry into the right pane and moves the tree highlight.
// `sel` identifies the clicked row: a key STRING for the virtualized redis tree
// (rows recycle, so we track the key), or a DOM ELEMENT for other backends.
async function loadContent(container, entry, sel, fromTree) {
  currentContainer = container;
  // Clear the query filter when switching to a different entry, or whenever the
  // user (re)clicks a tree node — even the current one — so a tree click always
  // resets to the default statement. Re-runs from the query box / commit /
  // rollback pass fromTree=false and keep the user's typed statement.
  if (fromTree || entry !== currentEntry) { currentQuery = ''; currentEntry = entry; }
  if (activeKey) { activeKey.classList.remove('active'); activeKey = null; }
  if (typeof sel === 'string') {
    activeKeyStr = sel;
    markActiveRows();
  } else if (sel) {
    activeKeyStr = null;
    sel.classList.add('active');
    activeKey = sel;
  }
  let url = `/api/content?${params(container)}&entry=${encodeURIComponent(entry)}`;
  if (currentQuery) url += `&query=${encodeURIComponent(currentQuery)}`;
  const r = await fetch(url);
  const c = await r.json();
  if (c.error) { $('value').innerHTML = `<div class="empty">${c.error}</div>`; return; }
  renderContent(c);
}

async function runCmd(cmd) {
  const out = $('cmdout');
  out.innerHTML += `<div>${currentContainer || ''}&gt; ${cmd}</div>`;
  try {
    const r = await fetch(`/api/cmd?${params(currentContainer)}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cmd})
    });
    const j = await r.json();
    const line = document.createElement('div');
    line.textContent = j.error ? `(error) ${j.error}` : j.reply;
    out.appendChild(line);
  } catch (e) {
    const line = document.createElement('div'); line.textContent = String(e); out.appendChild(line);
  }
  out.scrollTop = out.scrollHeight;
}

// ---- Background connection health poll (mirrors the TUI's status glyph) ----
// Only redis exposes a ping endpoint that's meaningful here; the poll asks the
// server every few seconds and tints the header dot green/red so a server that
// dies while the page is idle is reflected without the user clicking anything.
const POLL_INTERVAL = 3000;
let pollTimer = null;
let pollConn = -1; // connection index the current poll loop is bound to

// connStatusEl is the dot on the current tree's server (root) row; loadKeys
// re-creates it on every rebuild. connStatusState holds the latest poll result
// so a rebuild can re-apply it without waiting for the next ping.
let connStatusEl = null;
let connStatusState = 'hidden';

// applyConnStatus paints connStatusState onto connStatusEl (if the row exists).
function applyConnStatus() {
  const el = connStatusEl;
  if (!el) return;
  if (connStatusState === 'ok') {
    el.className = 'conn-status show';
    el.textContent = '●';
    el.style.color = '#2ecc71';
    el.title = 'Connected';
  } else if (connStatusState === 'down') {
    el.className = 'conn-status show';
    el.textContent = '✖';
    el.style.color = '#e74c3c';
    el.title = 'Connection lost — reload to retry';
  } else {
    el.className = 'conn-status'; // hidden: backend not pollable
    el.textContent = '';
    el.title = '';
  }
}

function setConnStatus(state) {
  connStatusState = state;
  applyConnStatus();
}

async function pingOnce(conn) {
  try {
    const r = await fetch(`/api/ping?conn=${encodeURIComponent(conn)}`);
    const j = await r.json();
    if (conn !== connSel.value) return; // selection changed mid-flight; ignore
    if (!j.pollable) { setConnStatus('hidden'); return; }
    setConnStatus(j.alive ? 'ok' : 'down');
  } catch (e) {
    if (conn === connSel.value) setConnStatus('down');
  }
}

// startPoll (re)binds the health poll to the selected connection. Cancels any
// prior loop so switching connections never leaves two timers running.
function startPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  pollConn = connSel.value;
  setConnStatus('hidden'); // until the first ping resolves
  pingOnce(pollConn);
  pollTimer = setInterval(() => {
    if (pollConn !== connSel.value) return; // stale guard
    pingOnce(pollConn);
  }, POLL_INTERVAL);
}

// onConnChange mirrors the old <select> onchange: persist selection + reload.
function onConnChange() {
  fetch(`/api/select?conn=${encodeURIComponent(connSel.value)}`, {method: 'POST'});
  loadKeys();
  startPoll();
}

// Custom dropdown interactions: toggle on the current-value box, pick on an
// option, close on outside click.
$('conn').querySelector('.cur').onclick = (e) => {
  e.stopPropagation();
  $('conn').classList.toggle('open');
};
$('conn').querySelector('.menu').onclick = (e) => {
  const opt = e.target.closest('.opt');
  if (!opt) return;
  $('conn').classList.remove('open');
  const i = Number(opt.dataset.i);
  if (i === connSel.value) return; // no change
  connSel.value = i; // re-renders
  onConnChange();
};
document.addEventListener('click', () => $('conn').classList.remove('open'));

// ---- Connection add / edit / delete ----

let connEditIndex = -1; // -1 = adding a new connection; else editing this index

// connFormState returns the "mode" used to decide which fields are visible:
// 'redis', 'mysql', 'mongo-form', or 'mongo-url'.
function connFormState() {
  const kind = $('f_kind').value;
  if (kind !== 'mongo') return kind;
  return $('f_mode').value === 'url' ? 'mongo-url' : 'mongo-form';
}

// updateConnFields shows only the rows relevant to the current kind/mode.
function updateConnFields() {
  const state = connFormState();
  document.querySelectorAll('#connModalBg .frow[data-show]').forEach(row => {
    row.hidden = !row.dataset.show.split(',').includes(state);
  });
  // the Mode selector only applies to mongo
  $('f_mode').closest('.frow').hidden = $('f_kind').value !== 'mongo';
}

// openConnModal fills and shows the modal. conf===null means add.
function openConnModal(conf, index) {
  connEditIndex = index;
  $('connModalTitle').textContent = conf ? 'Edit connection' : 'Add connection';
  $('connModalStatus').textContent = '';
  const c = conf || {};
  $('f_name').value = c.name || '';
  $('f_kind').value = c.kind || 'redis';
  $('f_host').value = c.host || '';
  $('f_port').value = c.port ? String(c.port) : '';
  $('f_user').value = c.user || '';
  $('f_auth').value = c.auth || '';
  $('f_db').value = c.db || '';
  $('f_uri').value = c.uri || '';
  // an existing mongo conn with a URI was saved in URL mode
  $('f_mode').value = (c.kind === 'mongo' && c.uri) ? 'url' : 'form';
  updateConnFields();
  $('connModalBg').classList.add('open');
  $('f_name').focus();
}

function closeConnModal() { $('connModalBg').classList.remove('open'); }

// connBodyFromForm assembles the JSON payload from the form fields.
function connBodyFromForm() {
  const kind = $('f_kind').value;
  const b = { index: connEditIndex, name: $('f_name').value.trim(), kind };
  if (kind === 'mongo' && $('f_mode').value === 'url') {
    b.uri = $('f_uri').value.trim();
  } else {
    b.host = $('f_host').value.trim();
    b.port = parseInt($('f_port').value, 10) || defaultPort(kind);
    b.user = $('f_user').value.trim();
    b.auth = $('f_auth').value;
    if (kind === 'mongo') b.db = $('f_db').value.trim();
  }
  return b;
}

function defaultPort(kind) {
  return {mongo: 27017, mysql: 3306}[kind] || 6379;
}

$('f_kind').onchange = updateConnFields;
$('f_mode').onchange = updateConnFields;

$('connAdd').onclick = () => openConnModal(null, -1);
$('connEdit').onclick = () => {
  const c = conns[connSel.value];
  if (c) openConnModal(c, connSel.value);
};
$('connDel').onclick = async () => {
  const c = conns[connSel.value];
  if (!c) return;
  if (!confirm(`Delete connection "${c.name}"? This cannot be undone.`)) return;
  const r = await fetch(`/api/conn/delete?conn=${encodeURIComponent(connSel.value)}`, {method: 'POST'});
  const j = await r.json();
  if (j.error) { alert('Delete failed: ' + j.error); return; }
  await loadConns();
  await onConnChange();
};
// treeReload re-fetches the key tree from the backend, then re-loads the
// currently-open entry's content if one is selected. Discards any staged
// (uncommitted) cell edits, since the tree is rebuilt from scratch. If a search
// term is active, the rebuilt tree is re-filtered so the view stays consistent.
$('treeReload').onclick = async () => {
  const container = currentContainer, entry = currentEntry;
  await loadKeys();
  if (($('match').value || '').trim()) await applySearch();
  if (container && entry) {
    // The previously-active row was destroyed by the rebuild; re-fetch its
    // content into the pane (passed el=null, so no row highlight is restored).
    loadContent(container, entry, null);
  }
};
$('connCancelBtn').onclick = closeConnModal;
$('connTestBtn').onclick = async () => {
  const b = connBodyFromForm();
  if (!b.name) { $('connModalStatus').innerHTML = '<span style="color:#e6b422">Name is required</span>'; return; }
  $('connModalStatus').innerHTML = '<span style="color:#888">Connecting…</span>';
  const r = await fetch('/api/conn/test', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b)
  });
  const j = await r.json();
  $('connModalStatus').innerHTML = j.error
    ? `<span style="color:#e74c3c">✖ ${j.error}</span>`
    : '<span style="color:#2ecc71">● Connect OK</span>';
};
$('connSaveBtn').onclick = async () => {
  const b = connBodyFromForm();
  if (!b.name) { $('connModalStatus').innerHTML = '<span style="color:#e6b422">Name is required</span>'; return; }
  const r = await fetch('/api/conn/save', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b)
  });
  const j = await r.json();
  if (j.error) { $('connModalStatus').innerHTML = `<span style="color:#e74c3c">${j.error}</span>`; return; }
  closeConnModal();
  const wasAdding = connEditIndex < 0;
  await loadConns();
  if (wasAdding) connSel.value = conns.length - 1; // select the new one
  await onConnChange();
};

// applySearch filters the tree by the search box: containers with no matching
// entry (and whose own name doesn't match) are hidden entirely; matching
// containers are shown and auto-expanded so their hits are visible. An empty
// term restores the full tree in its default collapsed state.
async function applySearch() {
  const term = ($('match').value || '').trim().toLowerCase();
  if (!term) { await loadKeys(); return; }
  const groups = document.querySelectorAll('#keys .children[data-container]');
  for (const kids of groups) {
    const container = kids.dataset.container;
    const row = kids.previousElementSibling;
    const tw = row.querySelector('.tw');
    // Fetch this container's entries filtered by the term (server applies the
    // glob/substring match); show the container only if it has hits or its own
    // name matches.
    let entries = [];
    try {
      const r = await fetch(`/api/entries?${params(container)}&match=${encodeURIComponent($('match').value)}`);
      const j = await r.json();
      if (!j.error && Array.isArray(j)) entries = j;
    } catch (e) { /* leave entries empty on error */ }
    const nameMatch = container.toLowerCase().includes(term);
    if (entries.length === 0 && !nameMatch) {
      teardownScroller(kids);
      row.style.display = 'none';
      kids.style.display = 'none';
      continue;
    }
    row.style.display = '';
    kids.style.display = '';
    kids.classList.remove('collapsed');
    if (tw) tw.textContent = '▾';
    // Render the entries we already fetched, expanded so nested hits show.
    renderEntries(container, kids, entries, true);
  }
}

// live search: re-filter as the user types, debounced so we don't refetch on
// every keystroke. Enter still forces an immediate reload.
let matchTimer = null;
$('match').oninput = () => {
  clearTimeout(matchTimer);
  matchTimer = setTimeout(applySearch, 200);
};
$('match').onkeydown = e => { if (e.key === 'Enter') { clearTimeout(matchTimer); applySearch(); } };
$('cmd').onkeydown = e => {
  if (e.key === 'Enter' && e.target.value.trim()) { runCmd(e.target.value.trim()); e.target.value = ''; }
};

(async () => { await loadConns(); await loadKeys(); startPoll(); })();
</script>
</body>
</html>
